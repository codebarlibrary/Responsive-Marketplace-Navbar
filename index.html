<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBar Marketplace Nav</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="#" class="logo">
                <i class="ri-code-s-slash-line"></i> CodeBar
            </a>

            <div class="search-bar">
                <i class="ri-search-line"></i>
                <input type="text" placeholder="Search components, templates...">
                <div class="shortcut">Ctrl K</div>
            </div>

            <nav class="desktop-nav">
                <a href="#">Explore</a>
                <a href="#">License</a>
                <a href="#" class="btn-login">Log In</a>
                <a href="#" class="btn-signup">Get All Access</a>
            </nav>

            <div class="mobile-actions">
                <button class="search-toggle"><i class="ri-search-line"></i></button>
                <button class="menu-toggle" id="menuBtn">
                    <i class="ri-menu-4-line"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="mobile-sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Menu</span>
            <button class="close-btn" id="closeBtn"><i class="ri-close-line"></i></button>
        </div>
        <div class="sidebar-content">
            <a href="#" class="sidebar-link"><i class="ri-compass-3-line"></i> Explore</a>
            <a href="#" class="sidebar-link"><i class="ri-file-list-3-line"></i> Components</a>
            <a href="#" class="sidebar-link"><i class="ri-layout-masonry-line"></i> Templates</a>
            <a href="#" class="sidebar-link"><i class="ri-question-line"></i> Support</a>
            
            <div class="sidebar-footer">
                <a href="#" class="btn-sidebar-login">Log In</a>
                <a href="#" class="btn-sidebar-signup">Get Access</a>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <script src="script.js"></script>
</body>
</html>
